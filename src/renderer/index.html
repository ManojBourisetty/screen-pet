<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>Screen Pet</title>
  <link rel="stylesheet" href="styles/puppy.css" />
</head>
<body>
  <div id="stage">
    <div id="house">
      <svg viewBox="0 0 120 108" width="96" height="86">
        <defs>
          <filter id="house-fluffy" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="3" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <path d="M 10 104 L 10 54 L 60 14 L 110 54 L 110 104 Z" fill="#d9a05b" filter="url(#house-fluffy)" />
        <path d="M 2 58 L 60 10 L 118 58 L 108 58 L 60 22 L 12 58 Z" fill="#8a4f2b" filter="url(#house-fluffy)" />
        <path d="M 44 104 L 44 68 C 44 60, 76 60, 76 68 L 76 104 Z" fill="#4a2c1a" />
      </svg>
    </div>

    <div id="bowl">
      <svg viewBox="0 0 60 30" width="52" height="26">
        <ellipse cx="30" cy="12" rx="28" ry="10" fill="#9aa0a6" />
        <ellipse cx="30" cy="9" rx="24" ry="8" fill="#d7dade" />
        <ellipse cx="30" cy="9" rx="17" ry="5.5" fill="#e8935c" />
      </svg>
    </div>

    <div id="leash">
      <svg viewBox="0 0 40 30" width="40" height="30">
        <path d="M 2 2 C 12 10, 22 14, 38 16" stroke="#7a5230" stroke-width="3" fill="none" stroke-linecap="round" />
        <circle cx="2" cy="2" r="4" fill="#5c3a1e" />
      </svg>
    </div>

    <div id="toy">
      <svg viewBox="0 0 30 30" width="24" height="24">
        <circle cx="15" cy="15" r="13" fill="#5db8d1" />
        <path d="M 4 15 A 11 11 0 0 1 26 15" stroke="#ffffff" stroke-width="2" fill="none" />
        <path d="M 4 15 A 11 11 0 0 0 26 15" stroke="#ffffff" stroke-width="2" fill="none" />
      </svg>
    </div>

    <div id="puppy" class="state-idle">
      <div id="zzz" class="zzz">Z<span>z</span><span>z</span></div>
      <div id="puppy-flip" class="facing-right">
      <svg id="puppy-svg" viewBox="0 0 220 170" width="140" height="108">
        <defs>
          <filter id="fluffy" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>

        <g id="tail" class="tail">
          <path d="M 178 108 C 205 100, 214 78, 200 60 C 214 74, 210 98, 186 116 Z"
                fill="#c98b4a" filter="url(#fluffy)" />
        </g>

        <g class="leg back-leg" id="leg-bl">
          <rect x="72" y="118" width="16" height="34" rx="7" fill="#c98b4a" />
        </g>
        <g class="leg back-leg" id="leg-br">
          <rect x="140" y="118" width="16" height="34" rx="7" fill="#c98b4a" />
        </g>

        <path id="body" d="M 60 118 C 40 96, 46 58, 90 48 C 130 40, 172 58, 176 92 C 180 118, 156 140, 116 140 C 86 140, 70 132, 60 118 Z"
              fill="#f0d2a0" filter="url(#fluffy)" />

        <path id="belly" d="M 84 132 C 96 142, 128 142, 140 130 C 132 140, 98 140, 84 132 Z" fill="#fff8ef" />

        <g class="leg front-leg" id="leg-fl">
          <rect x="66" y="124" width="17" height="36" rx="7" fill="#f0d2a0" />
        </g>
        <g class="leg front-leg" id="leg-fr">
          <rect x="132" y="124" width="17" height="36" rx="7" fill="#f0d2a0" />
        </g>

        <g id="head" class="head">
          <path class="ear ear-left" d="M 78 46 C 62 24, 58 6, 70 2 C 82 14, 88 34, 92 50 Z" fill="#c98b4a" filter="url(#fluffy)" />
          <path class="ear ear-right" d="M 132 46 C 148 24, 152 6, 140 2 C 128 14, 122 34, 118 50 Z" fill="#c98b4a" filter="url(#fluffy)" />

          <circle cx="105" cy="60" r="46" fill="#f0d2a0" filter="url(#fluffy)" />

          <path d="M 82 74 C 88 96, 122 96, 128 74 C 130 92, 108 106, 105 106 C 102 106, 80 92, 82 74 Z" fill="#fff8ef" />

          <circle class="blush" cx="72" cy="70" r="7" fill="#f6a5a5" opacity="0.55" />
          <circle class="blush" cx="138" cy="70" r="7" fill="#f6a5a5" opacity="0.55" />

          <g class="eyes">
            <ellipse class="eye eye-left" cx="86" cy="56" rx="6" ry="7.5" fill="#2b2118" />
            <ellipse class="eye eye-right" cx="124" cy="56" rx="6" ry="7.5" fill="#2b2118" />
            <circle cx="88.5" cy="53" r="1.6" fill="#fff" />
            <circle cx="126.5" cy="53" r="1.6" fill="#fff" />
          </g>

          <ellipse cx="105" cy="76" rx="7" ry="5.5" fill="#2b2118" />
          <path class="mouth" d="M 98 82 C 101 87, 109 87, 112 82" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round" />
        </g>
      </svg>
      </div>
      <div id="hearts"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
